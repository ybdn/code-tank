# Configuration locale uniquement. Aucun projet distant, aucun secret.
project_id = "code-tank-site"

[db]
# Ports décalés : 54322 est pris par un autre projet local.
port = 54422
shadow_port = 54420
major_version = 17

[db.migrations]
enabled = true

[api]
enabled = true
# Décalé comme la base : 54321 est pris par un autre projet local.
port = 54421
schemas = ["public"]

# Aucune boîte mail locale : aucun test n'envoie d'e-mail.
[local_smtp]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# Retour de la connexion GitHub.
additional_redirect_urls = ["http://127.0.0.1:3000/compte", "http://localhost:3000/compte"]
# Les comptes naissent de la connexion GitHub. Le fournisseur e-mail (mot de passe, actif par défaut) ne sert qu'en local :
# les tests de pile y ouvrent les sessions d'utilisateurs créés par l'API d'administration. En ligne, il est désactivé dans Auth.
enable_anonymous_sign_ins = false

# Identité et e-mail seulement : le fournisseur n'ajoute aucun scope (Auth ne demande que user:email, aucun accès aux
# dépôts) et retient l'e-mail principal vérifié de GitHub. Les valeurs viennent de l'environnement ; aucune application
# OAuth n'est créée par ce dépôt.
[auth.external.github]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET)"
